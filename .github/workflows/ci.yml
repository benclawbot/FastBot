name: FastBot CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: fastbot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # Do not install the Python orchestration package in the JS dependency
      # gate: its postinstall provisions a separate Python environment.
      - name: Install JavaScript workspaces
        run: pnpm install --frozen-lockfile --filter './packages/dashboard' --filter './packages/gateway' --filter './packages/playwright'

      # The repository's `next lint` script currently launches an interactive
      # ESLint setup wizard because no ESLint config is installed. Enforce the
      # existing strict TypeScript configuration non-interactively instead.
      - name: Typecheck dashboard
        run: pnpm --filter @fastbot/dashboard exec tsc --noEmit

      - name: Test gateway
        run: pnpm --filter @fastbot/gateway run test

      - name: Build JavaScript workspaces
        run: |
          pnpm --filter @fastbot/gateway run build
          pnpm --filter @fastbot/dashboard run build
          pnpm --filter @fastbot/playwright run build
