name: Temporary XLSX lockfile refresh
on:
  push:
    branches:
      - security/replace-xlsx-reader-20261122

permissions:
  contents: write

jobs:
  lockfile:
    name: Regenerate and commit pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Resolve lockfile from updated package manifests
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify vulnerable XLSX package is absent
        run: |
          ! grep -q 'xlsx@0.18.5' pnpm-lock.yaml
          grep -q 'read-excel-file@9.3.20' pnpm-lock.yaml
      - name: Commit lockfile to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build(deps): regenerate pnpm lockfile for XLSX reader"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
