version: 2
updates:
  # pnpm workspace (root pnpm-lock.yaml)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm_and_yarn:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Python orchestration package (packages/orchestration/pyproject.toml)
  - package-ecosystem: pip
    directory: "/packages/orchestration"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
